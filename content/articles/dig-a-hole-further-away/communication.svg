<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" role="img" aria-label="Communicate when the signal arrives, before the blast radius grows" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13">
  <text x="24" y="28" font-size="15" font-weight="600" fill="#dadadb">Communicate when the signal arrives, before the blast radius grows</text>
  <text x="24" y="50" font-size="11.5" fill="#9b9c9d">Height: the blast radius, the possible impact on production and on other people's work.</text>
  <line x1="24" x2="736" y1="300" y2="300" stroke="#5a5b5e" stroke-width="1.25"/>
  <text x="228" y="104" text-anchor="middle" font-weight="600" fill="#dadadb">Digging alone</text>
  <text x="568" y="104" text-anchor="middle" font-weight="600" fill="#dadadb">With the owning teams</text>
  <line x1="432" x2="432" y1="86" y2="300" stroke="#4a90e2" stroke-width="1.25" stroke-dasharray="5 4"/>
  <text x="432" y="78" text-anchor="middle" font-size="11.5" font-weight="600" fill="#dadadb">interesting signal</text>
  <rect x="42" y="284" width="100" height="16" rx="4" fill="#2e3033" stroke="#5a5b5e" stroke-width="1.25"/>
  <rect x="178" y="268" width="100" height="32" rx="4" fill="#2e3033" stroke="#5a5b5e" stroke-width="1.25"/>
  <rect x="314" y="244" width="100" height="56" rx="4" fill="#2e3033" stroke="#5a5b5e" stroke-width="1.25"/>
  <rect x="450" y="190" width="100" height="110" rx="4" fill="#4a90e2" fill-opacity="0.15" stroke="#4a90e2" stroke-width="2"/>
  <rect x="586" y="130" width="100" height="170" rx="4" fill="#4a90e2" fill-opacity="0.15" stroke="#4a90e2" stroke-width="2"/>
  <g text-anchor="middle" font-size="11.5">
    <text x="92" y="322" font-weight="600" fill="#dadadb">Branches, local</text>
    <text x="92" y="340" fill="#9b9c9d">no impact</text>
    <text x="228" y="322" font-weight="600" fill="#dadadb">Measures on copies</text>
    <text x="228" y="340" fill="#9b9c9d">read only</text>
    <text x="364" y="322" font-weight="600" fill="#dadadb">Small AB test</text>
    <text x="364" y="340" fill="#9b9c9d">heads-up message</text>
    <text x="500" y="322" font-weight="600" fill="#dadadb">Larger tests</text>
    <text x="500" y="340" fill="#9b9c9d">planned together</text>
    <text x="636" y="322" font-weight="600" fill="#dadadb">Ramp-up</text>
    <text x="636" y="340" fill="#9b9c9d">decided together</text>
  </g>
</svg>
